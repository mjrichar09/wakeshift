<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Knuckleball Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f3efe6'/%3E%3Cpath d='M7 8c5 4 5 12 0 16M25 8c-5 4-5 12 0 16' fill='none' stroke='%23c8322d' stroke-width='2'/%3E%3C/svg%3E" />
    <meta name="description" content="Interactive 3D lab for low-spin ball flight: why a knuckleball and a volleyball float serve dance." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="masthead">
        <div class="brand">
          <h1>Knuckleball Lab</h1>
          <p class="brand__sub">
            <span class="seg seg--sport" role="radiogroup" aria-label="Sport">
              <button type="button" role="radio" data-sport="baseball" aria-checked="true">Baseball</button>
              <button type="button" role="radio" data-sport="volleyball" aria-checked="false">Volleyball</button>
            </span>
            <span id="preset-name">1/4 turn</span>
            <span id="outcome"></span>
            <button type="button" class="linkish" id="about-open">About the model</button>
            <button type="button" class="linkish" id="tour-open">Guided tour</button>
          </p>
        </div>
        <nav class="views" id="views" aria-label="Camera"></nav>
      </header>

      <main class="stage" id="stage">
        <canvas id="scene" aria-label="3D view of the ball flight"></canvas>
        <div class="hud" id="hud" aria-live="off"></div>
        <canvas class="gizmo" id="gizmo" width="120" height="120" aria-hidden="true"></canvas>
        <div class="split-label split-label--left" id="split-left" hidden></div>
        <div class="split-label split-label--right" id="split-right" hidden>Flow lab</div>
        <p class="schematic" id="schematic" hidden>Schematic flow, not CFD · potential flow upstream, illustrative wake</p>
        <figure class="legend" id="legend" hidden></figure>
        <figure class="spray" id="spray" hidden>
          <figcaption><span id="spray-title">Spray</span><button type="button" class="linkish" id="spray-close" aria-label="Close spray view">×</button></figcaption>
          <canvas id="spray-canvas" width="260" height="260"></canvas>
          <p class="spray__note" id="spray-note"></p>
        </figure>
        <div class="tour" id="tour" hidden>
          <p class="tour__eyebrow" id="tour-step"></p>
          <h2 id="tour-title"></h2>
          <p id="tour-body"></p>
          <div class="tour__nav">
            <button type="button" class="btn btn--quiet" id="tour-back">Back</button>
            <button type="button" class="btn" id="tour-next">Next</button>
            <button type="button" class="linkish" id="tour-close">Close</button>
          </div>
        </div>
        <div class="fade" id="fade"></div>
      </main>

      <section class="playbar" id="playbar" aria-label="Playback">
        <button type="button" class="pb-btn" id="pb-play" aria-keyshortcuts="Space" title="Play / pause (space)">▶</button>
        <button type="button" class="pb-btn" id="pb-back" aria-keyshortcuts="ArrowLeft" title="Step back 1 ms (←)">⏮</button>
        <button type="button" class="pb-btn" id="pb-fwd" aria-keyshortcuts="ArrowRight" title="Step forward 1 ms (→)">⏭</button>
        <button type="button" class="pb-btn" id="pb-replay" title="Replay from release">↺</button>
        <input type="range" class="pb-scrub" id="pb-scrub" min="0" max="1000" value="0" step="1" aria-label="Timeline" />
        <span class="pb-time" id="pb-time">0 ms</span>
        <span class="seg seg--speed" id="pb-speeds" role="radiogroup" aria-label="Playback speed"></span>
        <label class="pb-free" title="Free speed">
          <input type="range" id="pb-free" min="-2" max="0" step="0.01" value="-1" aria-label="Free speed (log scale)" />
        </label>
        <label class="pb-check"><input type="checkbox" id="pb-loop" checked /> Loop</label>
        <label class="pb-check" title="Slow down when the side force is large"><input type="checkbox" id="pb-auto" /> Auto-slow</label>
      </section>

      <section class="drawer" id="drawer" aria-label="Charts">
        <header class="drawer__head">
          <button type="button" class="linkish" id="drawer-toggle" aria-expanded="true">Charts ▾</button>
          <span class="drawer__hint">Click a chart to scrub · pinned runs: <span id="pins"></span></span>
        </header>
        <div class="charts" id="charts"></div>
      </section>

      <aside class="panel" id="panel" aria-label="Controls"></aside>
    </div>

    <dialog class="about" id="about">
      <form method="dialog"><button class="about__close" aria-label="Close">×</button></form>
      <div id="about-body"></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
